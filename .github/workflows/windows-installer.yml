# The Windows installer: the two programs built on Windows, packed by NSIS,
# then the result installed and removed on a real Windows.
#
# A pull request that touches the installer builds and tests it; so does a run
# started by hand. A `v*` tag does the same and attaches the installer to a
# draft release of that tag, for someone to read and publish.
name: Windows installer

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - packaging/windows/**
      - .github/workflows/windows-installer.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build the programs
    runs-on: windows-latest
    # A cold build of the window's egui stack on this runner is over half an
    # hour; the cache holds it from then on.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      # The command line and the window. The test bench is a development
      # tool and is not installed.
      - name: Build
        run: cargo build --release --locked -p omnifrog-cli -p omnifrog-gui

      - uses: actions/upload-artifact@v7
        with:
          name: programs
          path: |
            target/release/omnifrog.exe
            target/release/omnifrog-gui.exe
          if-no-files-found: error

  installer:
    name: Pack the installer
    needs: build
    # makensis is the same program on Linux, and one `apt-get` away.
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      file: ${{ steps.version.outputs.file }}
    steps:
      - uses: actions/checkout@v7

      # The version is the workspace's. A tag has to say the same.
      - name: Read the version
        id: version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          test -n "$version"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but Cargo.toml says $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "file=omnifrog-$version-windows-x86_64-setup.exe" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          name: programs
          path: stage

      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Pack
        run: |
          cp README.md LICENSE stage/
          makensis -V2 \
            -DVERSION="${{ steps.version.outputs.version }}" \
            -DSTAGE="$PWD/stage" \
            -DOUTFILE="$PWD/${{ steps.version.outputs.file }}" \
            packaging/windows/omnifrog.nsi

      - uses: actions/upload-artifact@v7
        with:
          name: installer
          path: ${{ steps.version.outputs.file }}
          if-no-files-found: error

  test:
    name: Install and uninstall
    needs: installer
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: installer

      - name: Test
        shell: pwsh
        run: >
          ./packaging/windows/test.ps1
          -Setup (Resolve-Path "${{ needs.installer.outputs.file }}")
          -Version "${{ needs.installer.outputs.version }}"

  release:
    name: Attach to a draft release
    if: github.ref_type == 'tag'
    needs: [installer, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: installer

      # A draft: nothing is announced until someone publishes it.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY"
          --draft
          --title "Omnifrog ${{ needs.installer.outputs.version }}"
          --notes "The Windows installer is not signed: Windows asks before running it."
          "${{ needs.installer.outputs.file }}"
