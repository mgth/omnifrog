# The separation models omnifrog knows, every entry driven through MSST. `key` is what the configuration and the command line name, `code`
# is the short form in the output file's name (`<film>.Omnifrog-<vo code>-<vf code>-<encoder>.mka`).
# `role` is a hint: a "voices" model also serves the original, the worker returns both stems.
# `rate: 44100` means the worker is handed 48 kHz samples under a 44.1 kHz header, so the
# Roformer neither resamples nor knows; `rate: 48000` is a true header (Bandit, 48 kHz native).
# `overlap` replaces the published config's inference.num_overlap (0 or absent = the author's):
# every sample is computed that many times, so the time is proportional to it.
# A user file beside the configuration adds or replaces entries by key.
models:
  # ---- Roformers of 2025-2026 (Hugging Face, the authors' own repositories) ----
  - key: uhav
    name: BS-Roformer HyperACE v2 Voc (unwa)
    code: uhav
    role: voices
    model_type: bs_roformer
    checkpoint: { url: https://huggingface.co/pcunwa/BS-Roformer-HyperACE/resolve/main/v2_voc/bs_roformer_voc_hyperacev2.ckpt, file: bs_roformer_voc_hyperacev2.ckpt }
    config:     { url: https://huggingface.co/pcunwa/BS-Roformer-HyperACE/resolve/main/v2_voc/config.yaml, file: bs_hyperace_v2_voc.yaml }
    module:     { url: https://huggingface.co/pcunwa/BS-Roformer-HyperACE/resolve/main/v2_voc/bs_roformer.py, file: bs_roformer_hyperace_v2.py }
    overlap: 2
    batch: 1
    notes: "Vocals 11.4 (Dec. 2025). Modified architecture shipped with its own bs_roformer.py. Three to eight times slower than Leap."
